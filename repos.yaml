version: 3
repos:
  - id: https://github.com/GeetaSree13/terraform_ansible
    workflow: custom

workflows:
  custom:
    plan:
      steps:
        - run: terraform init
        - run: terraform plan -out=tfplan
    apply:
      steps:
        - run: terraform apply tfplan
        - run: bash ./scripts/gen_inventory.sh
        - run: ansible-playbook -i ansible/inventory.yml ansible/playbook.yml