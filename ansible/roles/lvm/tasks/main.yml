# ---------- install tools ----------
- name: Ensure LVM packages are present
  package:
    name: lvm2
    state: present

# ---------- partition disk ----------
- name: Create GPT + single partition on {{ lvm_disk }}
  parted:
    device: "{{ lvm_disk }}"
    number: 1
    label: gpt
    state: present
    part_type: primary
    fs_type: linux-lvm
    resize: yes

# ---------- LVM pv/vg ----------
- name: Create physical volume
  command: pvcreate "{{ lvm_disk }}1"
  args: { creates: "/dev/disk/by-id/dm-name-{{ lvm_vg }}" }

- name: Create volume group
  command: vgcreate "{{ lvm_vg }}" "{{ lvm_disk }}1"
  args: { creates: "/dev/{{ lvm_vg }}" }

# ---------- logical volumes ----------
- name: Create logical volumes
  lvol:
    vg:  "{{ lvm_vg }}"
    lv:  "{{ item.name }}"
    size: "{{ item.size }}"
  loop: "{{ lvm_volumes }}"

# ---------- format & mount ----------
- name: Format ext4 on LVs
  filesystem:
    fstype: ext4
    dev: "/dev/{{ lvm_vg }}/{{ item.name }}"
  loop: "{{ lvm_volumes }}"

- name: Create mount points
  file:
    path: "{{ item.mount }}"
    state: directory
    mode: '0755'
  loop: "{{ lvm_volumes }}"

- name: Mount & persist
  mount:
    path: "{{ item.mount }}"
    src:  "/dev/{{ lvm_vg }}/{{ item.name }}"
    fstype: ext4
    opts: defaults
    state: mounted
  loop: "{{ lvm_volumes }}"
