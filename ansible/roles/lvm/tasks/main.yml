- name: Create partition on /dev/sdb
  parted:
    device: /dev/sdb
    number: 1
    label: gpt
    state: present
    part_type: primary
    fs_type: linux-lvm
    resize: yes

- name: Create physical volume
  command: pvcreate /dev/sdb1
  args:
    creates: /dev/sdb1

- name: Create volume group
  lvg:
    vg: vg_data
    pvs: /dev/sdb1

- name: Create logical volume for data
  lvol:
    vg: vg_data
    lv: data
    size: 30g

- name: Create logical volume for log
  lvol:
    vg: vg_data
    lv: log
    size: 10g

- name: Create logical volume for archive
  lvol:
    vg: vg_data
    lv: archive
    size: 10g

- name: Format /data logical volume
  filesystem:
    fstype: ext4
    dev: /dev/vg_data/data

- name: Mount /data logical volume
  mount:
    path: /data
    src: /dev/vg_data/data
    fstype: ext4
    state: mounted

- name: Format /log logical volume
  filesystem:
    fstype: ext4
    dev: /dev/vg_data/log

- name: Mount /log logical volume
  mount:
    path: /log
    src: /dev/vg_data/log
    fstype: ext4
    state: mounted

- name: Format /archive logical volume
  filesystem:
    fstype: ext4
    dev: /dev/vg_data/archive

- name: Mount /archive logical volume
  mount:
    path: /archive
    src: /dev/vg_data/archive
    fstype: ext4
    state: mounted