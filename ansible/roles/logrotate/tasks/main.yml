- name: Ensure logrotate is installed
  package:
    name: logrotate
    state: present

- name: Hourly logrotate rule for /log
  copy:
    dest: /etc/logrotate.d/custom_log
    content: |
      /log/*.log {
          hourly
          rotate 24
          missingok
          notifempty
          compress
          create 0640 root root
      }
