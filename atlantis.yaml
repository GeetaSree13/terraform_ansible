version: 3

workflows:
  custom:
    plan:
      steps:
        - run: terraform init
        - run: terraform plan -out=tfplan
    apply:
      steps:
        - run: terraform apply tfplan
        - run: ./scripts/dynamic_inventory.sh
        - run: cat ansible/inventory.yml
        - run: ansible-playbook -i ansible/inventory.yml ansible/playbook.yml

projects:
  - name: vm_project
    dir: terraform
    workflow: custom
    autoplan:
      enabled: true
      when_modified: ["*.tf", "scripts/*", "ansible/*"]
