version: 3

repos:
  - id: https://github.com/GeetaSree13/terraform_ansible
    workflow: custom

workflows:
  custom:
    plan:
      steps:
        - run: terraform -chdir=terraform init
        - run: terraform -chdir=terraform plan -out=tfplan
    apply:
      steps:
        - run: terraform -chdir=terraform apply tfplan
        - run: ./scripts/dynamic_inventory.sh
        - run: cat ansible/inventory.yml
        - run: ansible-playbook -i ansible/inventory.yml ansible/playbook.yml
