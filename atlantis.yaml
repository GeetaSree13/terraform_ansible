version: 3

projects:
  - dir: terraform
    workflow: custom

workflows:
  custom:
    plan:
      steps:
        - run: terraform init
        - run: terraform plan -out=tfplan
    apply:
      steps:
        - run: terraform apply tfplan
        - run: ../scripts/dynamic_inventory.sh
        - run: cat ../ansible/inventory.yml
        - run: ansible-playbook -i ../ansible/inventory.yml ../ansible/playbook.yml

##